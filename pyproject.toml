[project]
name = "voge-home-assistant"
version = "0.1.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.pyright]
pythonVersion = "3.14"
reportIncompatibleVariableOverride = "none"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
