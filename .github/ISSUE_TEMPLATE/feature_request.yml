name: Feature request
description: Propose a read-only integration improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This project accepts only read-only cloud features supported by verifiable API evidence. Vehicle control, account mutation, message mutation, binding changes, and security bypasses are outside the project scope.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: This request is strictly read-only.
          required: true
        - label: I will not post credentials, complete identifiers, precise locations, raw responses, or signing material.
          required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the user-facing need rather than an assumed API implementation.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Available evidence
      description: Describe sanitized field names, types, or capability flags. Do not paste raw responses.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should appear in Home Assistant.
    validations:
      required: true
