name: Bug report
description: Report a reproducible integration problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove tokens, mobile numbers, passwords, password MD5 values, VINs, complete device or route IDs, coordinates, addresses, message contents, and legacy signing material before submitting anything.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed all credentials and precise vehicle/location identifiers.
          required: true
        - label: I understand this integration is strictly read-only and will not request a vehicle-control feature here.
          required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.0
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual copy
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or logs
      description: Use Home Assistant diagnostics where possible and inspect the output before attaching it. Never attach raw cloud responses.
      render: text
